name: ci

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3

  firmware-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build firmware without the debug console
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: idf.py -B build-rel -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build && ! grep -qw console_start build-rel/hygeia.map

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C host_tests test
      - name: Check the time-zone table is current
        run: python3 tools/gen_tzdb.py third_party/posix_tz_db/zones.csv /tmp/t.c && diff -q /tmp/t.c components/hy_core/src/tzdb_data.c
