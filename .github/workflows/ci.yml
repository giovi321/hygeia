name: ci

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3

  firmware-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Work out the version
        id: ver
        run: |
          short="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then ver="${GITHUB_REF_NAME}"; else ver="dev-${short}"; fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
      - name: Build and package the release firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: .github/scripts/package-release.sh "${{ steps.ver.outputs.version }}"
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: hygeia-firmware-${{ steps.ver.outputs.short }}
          path: |
            dist/hygeia.bin
            dist/hygeia-full.hex
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [firmware, firmware-release, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          pattern: hygeia-firmware-*
          merge-multiple: true
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          cat > notes.md <<NOTES
          Firmware ${TAG} for the ESP32-S3 board.

          - hygeia.bin: application image, upload it in the web UI to update a running device.
          - hygeia-full.hex: bootloader, partition table, otadata and application as an Intel HEX file for a first install over USB. Flashing it leaves settings and stored data untouched.
          - SHA256SUMS: checksums of both files.
          NOTES
          sed -i 's/^ *//' notes.md
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber dist/hygeia.bin dist/hygeia-full.hex dist/SHA256SUMS
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md $flags \
              dist/hygeia.bin dist/hygeia-full.hex dist/SHA256SUMS
          fi

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C host_tests test
      - name: Check the time-zone table is current
        run: python3 tools/gen_tzdb.py third_party/posix_tz_db/zones.csv /tmp/t.c && diff -q /tmp/t.c components/hy_core/src/tzdb_data.c
